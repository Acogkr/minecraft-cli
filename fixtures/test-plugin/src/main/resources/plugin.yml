name: MinecraftCliTestPlugin
main: dev.minecraftcli.test.MinecraftCliTestPlugin
version: 0.1.0
api-version: '1.20'
commands:
  mctest:
    description: minecraft-cli test plugin command
    usage: /mctest
  mcnpc:
    description: spawn a minecraft-cli test NPC
    usage: /mcnpc spawn
  mcdialognpc:
    description: spawn an NPC that opens a native dialog on supported servers
    usage: /mcdialognpc
  mcgui:
    description: open a minecraft-cli slot test GUI
    usage: /mcgui
  mchelper:
    description: minecraft-cli helper event test command
    usage: /mchelper <give|transition|block|target|title|actionbar|bossbar|scoreboard|sound|signals|setup>
